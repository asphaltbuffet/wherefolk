changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## [{{.VersionNoPrefix}}] - {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
changeFormat: '- {{.Body}}{{if .Custom.Issue}} [{{.Custom.Issue}}]{{end}}'
kinds:
    - label: Added
      auto: minor
    - label: Changed
      auto: major
    - label: Deprecated
      auto: minor
    - label: Removed
      auto: major
    - label: Fixed
      auto: patch
    - label: Security
      auto: patch
newlines:
    afterChangelogHeader: 1
    afterChangelogVersion: 1
    beforeChangelogVersion: 1
    afterKind: 1
    beforeKind: 1
    endOfVersion: 1
footerFormat: "\n[{{.VersionNoPrefix}}]: https://github.com/asphaltbuffet/wherefolk/compare/{{if .PreviousVersion}}{{.PreviousVersion}}{{else}}v0.0.0{{end}}...{{.Version}}"
envPrefix: CHANGIE_
custom:
  - key: Issue
    label: 'GitHub Issues (comma separated, e.g. #1, #2)'
    type: string
